<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy: scripts, styles, fonts and images only from this
    site, no inline code or styles, and the only network calls allowed go to
    the Apps Script web app (script.google.com, which redirects to
    script.googleusercontent.com).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Keep status pages out of search engines, and never leak the URL in a Referer header. -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#180231" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#030206" media="(prefers-color-scheme: dark)">
  <title>Featured App Status</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- theme.js applies the visitor's saved theme before the page paints. -->
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <!-- config.js sets window.FA_STATUS_CONFIG; status.js reads it and fills <main>. -->
  <script src="config.js" defer></script>
  <script src="status.js" defer></script>
</head>
<body>
  <header class="p-top">
    <span class="p-brand">
      <!-- The official logo, white-lettered version: the header is on the purple band in both themes. -->
      <img class="p-logo" src="cf-logo-dark.svg" width="108" height="30" alt="Canton Foundation">
      <span class="p-divider" aria-hidden="true"></span>
      <span class="p-label">Featured App Status</span>
    </span>
    <span class="p-tools">
      <!-- Shown by status.js on pages opened with a private link (list, application, DVP request). -->
      <span class="p-user" data-private-link hidden>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
        Private link
      </span>
      <!-- White / dark theme. status.js keeps its label in step with the theme. -->
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </span>
  </header>

  <!-- status.js renders every screen in here; the HTML itself carries no data. -->
  <main class="p-main">
    <noscript>
      <div class="p-body p-narrow">
        <div class="d-head">
          <h1 class="p-h">Turn on JavaScript</h1>
          <p class="p-sub">This page needs JavaScript to show your application's status. Turn it on in your browser, then reload the page.</p>
        </div>
      </div>
    </noscript>
  </main>

  <!-- status.js fills the footer: links from its wording and config.js. -->
  <footer class="p-footer" data-footer></footer>
</body>
</html>
