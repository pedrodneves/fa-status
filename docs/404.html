<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Same policy as index.html. This page runs no script at all. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#030206" media="(prefers-color-scheme: dark)">
  <title>Page not found · Featured App Status</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!--
    Root-relative on purpose: GitHub Pages serves this page for any missing
    path (e.g. /a/b/c), where a relative "styles.css" would not resolve. This
    assumes the site lives at the root of its own domain (status.<domain>);
    at <user>.github.io/<repo>/ this page shows unstyled, which is harmless.
  -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="p-top">
    <span class="p-brand"><span class="p-mark" aria-hidden="true"></span>Featured App Status</span>
  </header>

  <main class="p-body p-narrow" data-screen="not-found">
    <div class="d-head">
      <h1 class="p-h">Page not found</h1>
      <p class="p-sub">There's nothing at this address. To see where your application stands, open the private status link from your email, or go to the status page's home and enter your email address.</p>
    </div>
  </main>
</body>
</html>
