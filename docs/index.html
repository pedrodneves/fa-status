<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Content-Security-Policy: scripts and styles only from this site, no inline
    code or styles, images only from here or data: URIs (the favicon), and the
    only network calls allowed go to the Apps Script web app (script.google.com,
    which redirects to script.googleusercontent.com).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Keep status pages out of search engines, and never leak the URL in a Referer header. -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161E26" media="(prefers-color-scheme: dark)">
  <title>Featured App Status</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F4F8F'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23FFFFFF' stroke-width='3.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <!-- config.js sets window.FA_STATUS_CONFIG; status.js reads it and fills <main>. -->
  <script src="config.js" defer></script>
  <script src="status.js" defer></script>
</head>
<body>
  <header class="p-top">
    <span class="p-brand"><span class="p-mark" aria-hidden="true"></span>Featured App Status</span>
    <!-- Shown by status.js on pages opened with a private link (list, application, DVP request). -->
    <span class="p-user" data-private-link hidden>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
      Private link
    </span>
  </header>

  <!-- status.js renders every screen in here; the HTML itself carries no data. -->
  <main class="p-body p-narrow">
    <noscript>
      <div class="d-head">
        <h1 class="p-h">Turn on JavaScript</h1>
        <p class="p-sub">This page needs JavaScript to show your application's status. Turn it on in your browser, then reload the page.</p>
      </div>
    </noscript>
  </main>
</body>
</html>
